<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Градиент для линии пульса: от черного к голубому -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Линия пульса (ЭКГ) -->
  <path d="M 20 60 L 50 60 L 60 60 L 70 40 L 80 80 L 90 20 L 100 70 L 110 60 L 140 60" 
        stroke="url(#pulseGradient)" 
        stroke-width="3.5" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Точка в начале пульса (черная) -->
  <circle cx="20" cy="60" r="4" fill="#000000"/>
  
  <!-- Точка на пике пульса (голубая) -->
  <circle cx="90" cy="20" r="5" fill="#0284c7"/>
  
  <!-- Текст "PulseCheck" -->
  <text x="160" y="70" 
        font-family="Arial, sans-serif" 
        font-size="36" 
        font-weight="700">
    <tspan fill="#000000">Pulse</tspan><tspan fill="#0284c7">Check</tspan>
  </text>
  
  <!-- Подпись -->
  <text x="160" y="95" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="400" 
        fill="#64748b"
        letter-spacing="1">
    INTERACTIVE LECTURES
  </text>
</svg>