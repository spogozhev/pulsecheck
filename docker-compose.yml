services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsecheck-postgres
    environment:
      POSTGRES_USER: slide
      POSTGRES_PASSWORD: slide
      POSTGRES_DB: slide_hz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slide -d slide_hz"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: pulsecheck-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
